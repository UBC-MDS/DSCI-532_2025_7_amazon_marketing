# install with conda env create -f environment.yaml

name: amazon-prime
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12  
  - altair=5.4.*
  - pandas>=2.2
  - matplotlib>=3.10
  - dash=2.16.1
  - dash-bootstrap-components=1.5.0
  - dash-table
  - pyarrow=19.0.1
  - Flask-Caching= 2.3.1
  - altair-all=5.5
  - pip
  - pip:
      - dash-vega-components
  

